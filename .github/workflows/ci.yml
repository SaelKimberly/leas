name: ci

# Two properties this file exists to guarantee, both chosen deliberately:
#
#   1. The Linux build runs inside an `ubuntu:22.04` container on a current
#      runner. glibc is forward-compatible only, so a binary linked against the
#      runner's 2.39 will not start on the 2.35 machines this project develops
#      on (`ldd --version` on the reference box: Ubuntu GLIBC 2.35). The floor is
#      therefore a property of the container, not of a runner label GitHub can
#      retire — `ubuntu-22.04` as a *label* is already deprecated.
#   2. No job enables `just fast`. That recipe adds `-Ctarget-cpu=native` (a
#      runner-specific CPU baseline) and sccache/mold, none of which belong in an
#      artifact meant to run elsewhere.
#
# Caching, in three layers, because the three costs have different lifetimes:
#
#   * `taiki-e/install-action` — prebuilt, checksum- and attestation-verified
#     binaries for `just` / `cargo-nextest` / the `deps` tools. This replaces
#     `cargo install`, which used to compile every tool on every run. Note it
#     covers `cargo-deny`, `cargo-machete` and `cargo-audit` from its manifest
#     list but falls back to cargo-binstall for `cargo-hakari` and
#     `cargo-outdated`, which are not in it.
#   * `actions/cache` for `~/.rustup`, where rust-cache does not reach — used by
#     the Windows job only. Two measured decisions are behind that:
#       - the `ubuntu:22.04` container does **not** cache its toolchain: runs
#         #5–#7 came in at 7:06 (cold), 7:11 (cold, saved at end) and 7:16
#         (restored), i.e. restoring ~250 MB costs what installing it does. It
#         also removes the one way a host job (glibc 2.39) could ever seed a
#         toolchain cache that the 2.35 container restores — a cache key is
#         immutable once written, so the first saver decides the content for
#         every later run, and a host-built `rustc` inside the container is the
#         very `GLIBC_2.38 not found` failure the container exists to prevent.
#       - the `deps` job has none either: 0:36 without it against 1:16 with.
#     The Windows entry stays because Windows re-installs the msvc target std
#     every run. Note that `actions/cache` saves in a post step that is skipped
#     when the job fails — so while the Windows tests are red this cache never
#     populates, and it starts paying the moment that job goes green.
#   * `Swatinem/rust-cache` for `~/.cargo/registry` + `./target` — keyed by the
#     rustc version and hashes of `Cargo.lock`/`Cargo.toml`/`rust-toolchain.toml`
#     /`.cargo/config.toml`. It must run *after* the toolchain exists, sets
#     `CARGO_INCREMENTAL=0`, and never caches the workspace crates themselves.
#     The repository shares a 10 GB cache budget with every branch, so
#     `cache-on-failure` is on (a red test run still leaves a warm cache) and the
#     `deps` job caches the registry only.
#
# Linkers: tried, measured, reverted — do not repeat this without new evidence.
# On `x86_64-unknown-linux-gnu` rustc already passes `-fuse-ld=lld` to the driver
# and retries without it when that fails (the stable `-Clinker-features` value is
# the `-lld` opt-out; `+lld` is unstable on 1.99), and the container's own gcc
# 11.4 accepts `-fuse-ld=lld|mold` by name. So both were wired in and measured:
# lld via one apt line with the flags left untouched, and mold 3.0.0 from its
# release tarball (verified to *run* inside this image) behind a RUSTFLAGS
# change. Warm runs, same cache namespace, per step:
#
#   step                          bfd (#8)   lld (#10)
#   prerequisites                    16 s        19 s
#   toolchain + task runners         15 s        18 s
#   cache restore                    52 s        74 s   <- nothing to do with linking
#   gate (fmt+clippy+nextest)       222 s       236 s
#   release build + floor assert     91 s       118 s
#   total                           413 s       477 s
#
# Both link-heavy steps got *slower*, the largest single delta is a step the
# linker cannot affect, and the warm baseline spans 6:53-7:16 unaided — so the
# effect sits at or below the noise floor. The same numbers say why: this job's
# time goes to compiling, linting and testing (~236 s), not to linking. Windows
# agreed (8:41 warm with lld-link against 7:00 warm without, on a changed cache
# key). A real verdict would need several runs per configuration, i.e. CI time
# spent measuring a step that is not the bottleneck.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  code-linux:
    name: code (linux, glibc 2.35 floor)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Prerequisites (C toolchain for ring / zstd-sys / libsqlite3-sys)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config
      - uses: actions/checkout@v7
      - name: Toolchain + task runners (prebuilt, verified)
        uses: taiki-e/install-action@v2
        with:
          tool: rust+rustfmt+clippy,just,cargo-nextest
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Gate — fmt, clippy, tests
        run: just quality-gate-ci code

      # The `code` gate never produces `target/release/leas`, so the floor this
      # container exists to hold would otherwise be an unverified claim. Assert
      # it against a real optimized binary.
      - name: Release binary stays runnable on the 2.35 floor
        run: |
          cargo build --release -p leas
          max="$(objdump -T target/release/leas | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "highest required symbol: ${max:-none}"
          test "$(printf '%s\n' GLIBC_2.35 "$max" | sort -V | tail -1)" = "GLIBC_2.35"

  code-windows:
    name: code (windows-2022, x86_64-pc-windows-msvc)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Cache the rustup toolchain (Windows pays the same download)
        uses: actions/cache@v6
        with:
          path: ~/.rustup
          key: rustup-windows2022-${{ hashFiles('rust-toolchain.toml') }}
      - name: nasm (ring assembles its perlasm with it on Windows)
        run: |
          choco install -y nasm
          echo "/c/Program Files/NASM" >> "$GITHUB_PATH"
      - name: Task runners (prebuilt, verified)
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Toolchain components (the runner ships rustup already)
        run: rustup component add rustfmt clippy
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Gate — fmt, clippy, tests
        run: just quality-gate-ci code

  deps:
    name: deps (single-homed on linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # No toolchain cache here, on measurement: run #4 did this job in 0:36
      # without one and run #5 took 1:16 with a restore, i.e. fetching and
      # unpacking ~250 MB costs more than the install the runner has already
      # done. It also removes the only way a host job (glibc 2.39) could seed a
      # toolchain cache that the 2.35 container job then restores.
      - name: Gate tools (prebuilt where listed, cargo-binstall otherwise)
        uses: taiki-e/install-action@v2
        with:
          tool: |
            just
            cargo-deny
            cargo-machete
            cargo-audit
            cargo-hakari
            cargo-outdated
      - name: "Cache the cargo registry only (nothing is built in this job)"
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Gate — hakari, deny, machete, outdated, audit
        run: just quality-gate-ci deps
