name: stable-drift

# `rust-toolchain.toml` floats on `stable`, so a new Rust release can promote a
# lint and redden the `-D warnings` gate — or break the build — with no commit
# from anyone. This job is the only guard: it re-runs the code gate on the
# *newest* stable, container and all, so the floor question and the toolchain
# question cannot mask each other.
#
# It deliberately carries no `~/.rustup` cache: a cached toolchain is the one
# thing that would defeat the point of the job. The cargo registry and target
# caches are still worth having, and they are keyed on the rustc version, so a
# new stable starts its own.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Beats rust-toolchain.toml, whose point is the same moving target.
  RUSTUP_TOOLCHAIN: stable

jobs:
  stable-drift:
    name: code gate against freshly updated stable
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config
      - uses: actions/checkout@v7
      - name: Newest stable + task runners
        uses: taiki-e/install-action@v2
        with:
          tool: rust+rustfmt+clippy,just,cargo-nextest
      - name: Update to the newest stable
        run: rustup update stable
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Gate — fmt, clippy, tests
        run: just quality-gate-ci code
