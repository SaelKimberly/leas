[package]
name = "leas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core facade for leas: config builders, process management, gRPC stats, ping managers, and log storage"
readme.workspace = true
keywords = ["proxy", "vpn", "core"]
categories = ["network-programming"]


[features]
default = ["quic-ping"]
quic-ping = ["dep:quinn", "dep:rustls"]
[dependencies]
# ============ Serialization ============
serde.workspace = true
serde_json.workspace = true

yaml-rust2.workspace = true
# ============ Error Handling ============
thiserror.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["socks", "stream", "json"]

# ============ Async Runtime & I/O ============
	tokio.workspace = true
tokio.features = ["process", "signal", "sync", "fs", "time", "io-util", "rt", "rt-multi-thread", "net"]
futures-util.workspace = true

# ============ Protocol ============
tonic = "0.14.6"
semver = { version = "1.0.28", features = ["std"] }
async-trait = "0.1.92"
prost = "0.14.4"
quinn = { workspace = true, optional = true }
# Transitive feature override (user-directed): tokio-rustls 0.26 defaults to
# the aws_lc_rs backend (`default = ["logging", "tls12", "aws_lc_rs"]`).
# The pin now lives in the workspace manifest; this edge is what keeps rustls
# at exactly one backend in the whole graph — `ClientConfig::builder()`
# auto-selects it and never hits the dual-backend "Could not automatically
# determine the process-level CryptoProvider" panic. All other edges (reqwest
# rustls-no-provider, quinn, hyper-rustls) already opt out of tokio-rustls
# defaults.
tokio-rustls = { workspace = true, features = ["logging"] }
rustls = { workspace = true, optional = true, features = ["tls12", "logging", "ring"] }
tonic-prost = "0.14.6"

# ============ Build & Archiving ============
zip = "8.6.0"
flate2.workspace = true
tar = "0.4.46"

# ============ Internal ============
leas-db = { path = "../leas-db", version = "0.1.0" }
leas-proto = { path = "../leas-proto", version = "0.1.0" }

# ============ Logging ============
tracing.workspace = true
libc = "0.2.189"
tempfile.workspace = true

# ============ Persistent Log Storage ============
# `default-features = false`: heed's defaults are `serde`, `serde-bincode`
# and `serde-json`, and this store uses NONE of them — every database is
# opened on heed's NATIVE codec types (`U64BE`/`Bytes` for logs,
# `Str`/`Unit` for targets) and encoding is done by hand with postcard
# (see `log_heed.rs`). Dropping the defaults removes `bincode` 1.3.3
# (RUSTSEC-2025-0141, unmaintained) from the graph, which is what turns the
# one `cargo deny check advisories` failure green. `serde_json` stays — it is
# a direct workspace dep in five crates and arrives via tonic/prost anyway.
heed = { version = "0.22.1", default-features = false }
# Serialization for the LMDB log store. `default-features = false` drops
# postcard's default `heapless-cas` feature: we only use `to_slice` (core),
# `to_allocvec` and `from_bytes` — never `postcard::heapless` — so this removes
# unmaintained `heapless 0.7`/`atomic-polyfill` from the graph.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
leas-hakari = { version = "0.1", path = "../leas-hakari" }

	[build-dependencies]
	tonic-prost-build = "0.14.6"
	# Pure-Rust protobuf front-end. `protoc` stops being a build prerequisite:
	# protox parses the source in-process and hands `prost-build::compile_fds` a
	# `FileDescriptorSet`, so the emitted code is unchanged (pinned by a byte
	# comparison against the protoc-generated baseline).
	protox = "0.9"

	[lints]
	workspace = true

	[dev-dependencies]
	toasty = { workspace = true, features = ["serde"] }
	rstest.workspace = true

	[package.metadata.cargo-machete]
	# Deps used only by build.rs / OUT_DIR-generated code (invisible to
	# cargo-machete) or documented feature overrides:
	# - prost, tonic-prost, tonic-prost-build: tonic codegen output in OUT_DIR
	# - protox: build-script-only protobuf front-end, no `use` in the crate
	# - tokio-rustls: deliberate transitive backend override (ring pin), see the
	#   comment in [dependencies]
	ignored = ["prost", "tonic-prost", "tonic-prost-build", "protox", "tokio-rustls"]
