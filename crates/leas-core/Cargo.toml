[package]
name = "leas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native-shared session glue for leas: ping managers, speed tests, and log storage"
readme.workspace = true
keywords = ["proxy", "vpn", "ping"]
categories = ["network-programming"]


[features]
default = ["quic-ping"]
quic-ping = ["dep:quinn", "dep:rustls"]
[dependencies]
# ============ Serialization ============
serde.workspace = true

# ============ Error Handling ============
thiserror.workspace = true

# ============ Networking ============
reqwest.workspace = true
reqwest.features = ["socks", "stream", "json"]

# ============ Async Runtime & I/O ============
tokio.workspace = true
tokio.features = ["sync", "fs", "time", "io-util", "rt", "rt-multi-thread", "net"]
futures-util.workspace = true

# ============ Protocol ============
async-trait.workspace = true
quinn = { workspace = true, optional = true }
# Transitive feature override (user-directed): tokio-rustls 0.26 defaults to
# the aws_lc_rs backend (`default = ["logging", "tls12", "aws_lc_rs"]`).
# The pin now lives in the workspace manifest; this edge is what keeps rustls
# at exactly one backend in the whole graph.
tokio-rustls = { workspace = true, features = ["logging"] }
rustls = { workspace = true, optional = true, features = ["tls12", "logging", "ring"] }

# ============ Internal ============
leas-proto = { path = "../leas-proto", version = "0.1.0" }

# ============ Logging ============
tempfile.workspace = true

# ============ Persistent Log Storage ============
# `default-features = false`: heed's defaults are `serde`, `serde-bincode`
# and `serde-json`, and this store uses NONE of them — every database is
# opened on heed's NATIVE codec types (`U64BE`/`Bytes` for logs,
# `Str`/`Unit` for targets) and encoding is done by hand with postcard
# (see `log_heed.rs`). Dropping the defaults removes `bincode` 1.3.3
# (RUSTSEC-2025-0141, unmaintained) from the graph.
heed = { version = "0.23.1", default-features = false }
# Serialization for the LMDB log store. `default-features = false` drops
# postcard's default `heapless-cas` feature.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
leas-hakari = { version = "0.1", path = "../leas-hakari" }

[lints]
workspace = true

[dev-dependencies]

[package.metadata.cargo-machete]
# Deliberate transitive backend override (ring pin), see the comment in
# [dependencies].
ignored = ["tokio-rustls"]
