[package]
name = "leas-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed persistence for leas — SQLite via toasty over Turso: schema, migrations, page query, write-behind"
readme.workspace = true
keywords = ["database", "sqlite", "orm"]
categories = ["database"]

[dependencies]
# ============ ORM ============
# `turso` here is the DRIVER only: the vendored local-only fork
# (`src/driver/`) replaces `toasty-driver-turso`, so the `turso` feature is
# deliberately NOT enabled on `toasty` (else upstream's driver would return
# via the feature flag and dual-resolve its own turso pin).
toasty = { workspace = true, features = ["serde", "jiff"] }
toasty-core = "0.11"
toasty-sql = "0.11"
# `default-features = false` rather than the default `["mimalloc", "fts"]`:
# `fts` is the ONLY path to tantivy, and turso's `tantivy ^0.26.2` pin drags
# `zstd 0.13.3` / `zstd-safe 7.3.0`, which RUSTSEC-2026-0391, -0398 and -0403
# fix in zstd 0.14.3 / zstd-safe 8.2.0. tantivy 0.27 (zstd ^0.14, optional) is
# out of turso's `^0.26.2` range and 0.9.0-pre.2 is turso's newest release, so
# the upgrade exists upstream but not in this graph. This schema holds no FTS
# index and never issues an `fts` statement, so the feature buys nothing.
#
# `mimalloc` is NOT requested here: that feature installs a
# `#[global_allocator]` from inside this library's dependency tree, which
# leaves the process allocator unconfigurable and unswappable above it. The
# binary owns it instead — `crates/leas/src/alloc.rs`.
turso = { version = "=0.9.0-pre.2", default-features = false }
async-trait.workspace = true

# ============ Time ============
jiff = { workspace = true }

# ============ JSON (the projection decodes the stored JSON-array columns) ============
serde_json.workspace = true

# ============ Typed proto configs ============
leas-proto = { path = "../leas-proto", version = "0.1.0" }

# ============ Error Handling ============
	thiserror.workspace = true

# ============ Logging ============
tracing.workspace = true

# ============ Text / Search / Hash ============
uuid.workspace = true
# blob literal (`x'…'`) hex for the bulk upsert statements
hex.workspace = true
# insertion-ordered dedup maps in the write-behind/bulk writers
indexmap = "2.14.2"
rapidhash.workspace = true
# inline (≤17-byte) packed address keys in the bulk writers
smallvec.workspace = true

# ============ Async Runtime & I/O ============
tokio.workspace = true
dashmap.workspace = true
leas-hakari = { version = "0.1", path = "../leas-hakari" }

[features]
# Measurement probes (`geo_under_mvcc_probe`, `mvcc_load_probe`,
# `micro_batch_mvcc_probe`, the turso planner gate) and the concurrent-staging
# probe in `tests/partitioned_writers.rs`. They measure a path instead of
# gating CI, so the feature keeps them out of the test list and they carry
# `#[ignore]` on top. Run with
# `cargo test -p leas-db --release --features perf-lab -- --ignored --nocapture`.
perf-lab = []

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
toasty = { workspace = true, features = ["serde", "jiff"] }
jiff = { workspace = true }
leas-proto = { path = "../leas-proto", version = "0.1.0" }
tempfile.workspace = true
rstest.workspace = true
