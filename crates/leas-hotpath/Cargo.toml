[package]
name = "leas-hotpath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Exact allocation-count gate for leas hot paths (a benchmark binary, not a library)"
publish = false
# Two bins: the gate (this name, so `cargo run -p leas-hotpath` keeps working)
# and `memtrace`, the artifact writer.
default-run = "leas-hotpath"

[dependencies]
leas-native = { path = "../leas-native", version = "0.1.0" }
# `memtrace`'s `geosite` workload measures the geo loader in isolation.
leas-geoip = { path = "../leas-geoip", version = "0.1.0" }
leas-tls = { workspace = true }
# The tracer the `memtrace` bin installs as this binary's process allocator.
leas-memtrace = { path = "../leas-memtrace", version = "0.1.0" }
# `memtrace compare` reads the artifacts the tracer writes.
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync"] }
leas-hakari = { version = "0.1", path = "../leas-hakari" }

[[bin]]
name = "memtrace"
path = "src/bin/memtrace.rs"

[lints]
workspace = true
