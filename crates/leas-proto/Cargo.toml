[package]
name = "leas-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Protocol config types for leas — share-URL parsing, Clash YAML conversion, typed identity, core injection"
readme.workspace = true
keywords = ["proxy", "protocol", "vpn", "clash"]
categories = ["network-programming", "parser-implementations"]



[features]
default = []
experimental = []

[dependencies]
# ============ Serialization ============
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { version = "^3.24.0", default-features = false, features = ["macros"] }

# ============ URL & Encoding ============
url = { workspace = true }
urlencoding.workspace = true
base64.workspace = true

# ============ Error Handling ============
thiserror = { workspace = true }

# ============ Text / Search / Hash ============
rapidhash.workspace = true
uuid = { workspace = true, features = ["v5"] }

# ============ TLS ============
rustls = { workspace = true, features = ["std", "tls12"] }

# ============ Parsing ============
nom = { version = "^8.0.0", default-features = false, features = ["std"] }

# ============ ORM (Embed derives only) ============
toasty.workspace = true

# ============ Performance & Memory ============
smallvec.workspace = true

# ============ Public-suffix DNS split (db-rewamp D2/D6) ============
psl2 = "0.1.35"
bstr = { version = "^1.13.1", default-features = false, features = ["std"] }
daachorse.workspace = true
# Small inline string for URL/credential text. `compact_str` replaces the
# unmaintained `smartstring` (RUSTSEC-2026-0249). 0.10 carries upstream's
# UB/unsoundness fixes, so the pin moves up; ratatui-core has not shipped its
# own 0.10 bump yet, so the graph now carries a deliberate 0.9/0.10 dual-major
# pair (the two `CompactString` types never meet — ratatui keeps its copy
# private). The serde impl is byte-identical, so the on-the-wire shape and
# the identity-hash inputs are unchanged.
compact_str = { version = "^0.10", features = ["serde"] }

# ============ IDNA for hostname parsing ============
idna = { version = "^1.1.0", default-features = false, features = ["std", "compiled_data"] }

# ============ Logging ============
tracing = { workspace = true }
leas-hakari = { version = "0.1", path = "../leas-hakari" }

[lints]
workspace = true

# Identity benches: per-kind `ParsedProto::identity_once()` cost. Hermetic —
# no cores, no sockets, no features; `cargo criterion -p leas-proto
# --bench identity`.
[[bench]]
name = "identity"
harness = false

[dev-dependencies]
criterion = { workspace = true }
rstest.workspace = true
