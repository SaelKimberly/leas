[graph]
# Match rust-toolchain.toml targets; excludes UEFI-only r-efi (LGPL-2.1-or-later) from the graph.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Intentional warn (not deny): the tree has legitimate semver-major duplicates (aes 0.8/0.9,
# rustix 0.38/1.1, ...). Deny here would fail the gate today; tightening is future work.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
