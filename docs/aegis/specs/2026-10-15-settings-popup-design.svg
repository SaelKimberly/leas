<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="monospace" font-size="13">
  <defs><style>
    .a { fill: var(--accent); } .f { fill: var(--fg); } .m { fill: var(--muted); }
    .b { stroke: var(--border); } .e { fill: var(--error); } .s { fill: var(--success); }
    .sb { fill: var(--surface); }
    text { white-space: pre; }
  </style></defs>

  <!-- Settings popup detail: xrat-grade per-field feedback inside our split tree+form -->
  <rect x="10" y="10" width="680" height="400" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.6"/>
  <text class="a" x="26" y="34" font-weight="bold"> Settings * · ~/.config/leas/config.json</text>
  <text class="m" x="674" y="34" text-anchor="end">←/→ pane · Enter edit · r reset · ^S save · Esc close</text>
  <line x1="12" y1="44" x2="688" y2="44" class="b"/>

  <!-- search / edit input row -->
  <rect x="22" y="52" width="656" height="26" fill="none" stroke="var(--accent)" stroke-width="0.8"/>
  <text class="a" x="28" y="60" font-weight="bold"> Edit test-url · (unit: url)</text>
  <text class="f" x="28" y="74">https://cp.cloudflare.com█</text>

  <!-- left: sections -->
  <rect x="22" y="88" width="240" height="200" fill="none" stroke="var(--border)" stroke-width="0.8"/>
  <text class="a" x="28" y="102" font-weight="bold">› Core Settings</text>
  <text class="f" x="28" y="118">  GUI Settings</text>
  <text class="f" x="28" y="134">  Protocol Core</text>
  <text class="a" x="28" y="150" font-weight="bold">› DNS Settings</text>
  <text class="f" x="28" y="166">  Routing Rules</text>
  <text class="a" x="28" y="182" font-weight="bold">› Speed Test</text>
  <text class="f" x="28" y="198">  TUN Mode</text>
  <text class="f" x="28" y="214">  Mux</text>
  <text class="f" x="28" y="230">  Subscriptions</text>
  <text class="f" x="28" y="246">  Updates</text>
  <text class="m" x="28" y="268">Sections 5/14</text>
  <line x1="238" y1="88" x2="238" y2="288" class="b"/>

  <!-- right: values -->
  <rect x="244" y="88" width="434" height="200" fill="none" stroke="var(--border)" stroke-width="0.8"/>
  <text class="a" x="252" y="102" font-weight="bold">› test-url</text>
  <text class="f" x="420" y="102">https://cp.cloudflare.com</text>
  <text class="f" x="252" y="118">  fast-ping-concurrency</text>
  <text class="m" x="420" y="118">200</text>
  <text class="f" x="252" y="134">  real-ping-concurrency</text>
  <text class="m" x="420" y="134">100</text>
  <text class="f" x="252" y="150">  error-ttl-hours</text>
  <text class="m" x="420" y="150">24</text>
  <text class="m" x="252" y="166">  real-ping-test-all-protocols</text>
  <text class="m" x="420" y="166">false</text>
  <text class="f" x="252" y="182">  dns-failure-deferral</text>
  <text class="f" x="420" y="182">true</text>
  <text class="m" x="252" y="206">  batch task queue limit</text>
  <text class="m" x="420" y="206">— (default)</text>
  <text class="m" x="252" y="228">  ping timeout</text>
  <text class="m" x="420" y="228">3 s</text>
  <text class="m" x="252" y="250">  exit-ip provider</text>
  <text class="m" x="420" y="250">ip-api.com</text>
  <text class="m" x="252" y="272">Values 12/31</text>

  <!-- help strip -->
  <line x1="12" y1="296" x2="688" y2="296" class="b"/>
  <text class="a" x="26" y="312" font-weight="bold">Description</text>
  <text class="f" x="150" y="312">URL a real ping fetches through the proxy</text>
  <text class="a" x="26" y="328" font-weight="bold">Values</text>
  <text class="f" x="150" y="328">any http(s) URL · default https://www.gstatic.com/generate_204</text>
  <text class="a" x="26" y="344" font-weight="bold">Default</text>
  <text class="m" x="150" y="344">https://www.gstatic.com/generate_204</text>
  <text class="a" x="26" y="360" font-weight="bold">Source</text>
  <text class="f" x="150" y="360">+ explicit override in config.json</text>
  <text class="a" x="26" y="376" font-weight="bold">Applies</text>
  <text class="f" x="150" y="376">on connect — every real ping routes through the local SOCKS proxy</text>
  <text class="a" x="26" y="392" font-weight="bold">Legend</text>
  <text class="m" x="150" y="392">· inherited default  + explicit override  * unsaved (title)</text>

  <!-- status line -->
  <rect x="10" y="380" width="680" height="0" fill="none"/>
  <text class="e" x="252" y="312">* unsaved change · r resets this field to default</text>
  <text class="s" x="252" y="328">Enter applies this field only; ^S saves all</text>
</svg>
